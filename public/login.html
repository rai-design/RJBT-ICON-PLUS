<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dashboard Preventive Maintenance RJBT</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1e293b;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-top: 4px solid #005b94;
      border-radius: 18px;
      padding: 36px 32px 30px;
      box-shadow: 0 14px 38px rgba(11, 65, 113, 0.09);
      animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Header Logo PLN Icon Plus RJBT */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid #f1f5f9;
    }

    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .sidebar-brand-img {
      height: 46px;
      width: auto;
      object-fit: contain;
    }

    .brand-text-group {
      text-align: left;
      line-height: 1.1;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #005b94;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: #475569;
      font-weight: 700;
    }

    .brand-system-tag {
      font-size: 0.78rem;
      color: #64748b;
      font-weight: 600;
      margin-top: 4px;
      letter-spacing: 0.2px;
    }

    /* Form Styles */
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #334155;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.92rem;
      transition: color 0.2s;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #005b94;
    }

    .form-control {
      width: 100%;
      padding: 12px 40px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      color: #0f172a;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.22s ease;
    }

    .form-control::placeholder {
      color: #94a3b8;
    }

    .form-control:focus {
      background: #ffffff;
      border-color: #005b94;
      box-shadow: 0 0 0 3px rgba(0, 91, 148, 0.14);
    }

    .input-wrapper:focus-within .input-icon {
      color: #005b94;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #005b94 0%, #0084bd 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(0, 91, 148, 0.25);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #004a78 0%, #0072a6 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 91, 148, 0.32);
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    /* Alert Message Box */
    .alert-box {
      padding: 10px 14px;
      border-radius: 9px;
      font-size: 0.8rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #f1f5f9;
      font-size: 0.74rem;
      color: #64748b;
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Header Logo PLN Icon Plus RJBT -->
    <div class="brand-header">
      <div class="brand-logo-badge">
        <img src="pln-logo.png" alt="PLN Icon Plus Logo" class="sidebar-brand-img">
        <div class="brand-text-group">
          <div class="brand-title">PLN</div>
          <div class="brand-subtitle">Icon Plus</div>
        </div>
      </div>
      <div class="brand-system-tag">Monitoring &amp; Preventive Maintenance RJBT</div>
    </div>

    <!-- Alert Message -->
    <div id="alertBox" class="alert-box"></div>

    <!-- Form Login -->
    <form id="formLogin" class="auth-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUsername">Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username" required autocomplete="username" autofocus>
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
        </div>
      </div>

      <button type="submit" id="btnSubmitLogin" class="btn-submit">
        <span>Masuk Ke Dashboard</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="footer-text">
      &copy; 2026 PLN Icon Plus SBU Regional Jawa Bagian Timur.<br>
      Preventive Maintenance &amp; Monitoring System.
    </div>
  </div>

  <script>
    // Toggle Lihat / Sembunyikan Password
    function togglePasswordVisibility(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Tampilkan Pesan Notifikasi
    function showAlert(message, isSuccess = false) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
      alertBox.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> <span>${message}</span>`;
      alertBox.style.display = 'flex';
    }

    // Process Login
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btnSubmit = document.getElementById('btnSubmitLogin');

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Memverifikasi...</span>';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Login berhasil! Mengalihkan ke Dashboard...', true);
          localStorage.setItem('user_session', JSON.stringify(data.user || { username: 'admin' }));
          
          setTimeout(() => {
            window.location.replace('/index.html');
          }, 700);
        } else {
          showAlert(data.error || 'Username atau password salah!');
          btnSubmit.disabled = false;
          btnSubmit.innerHTML = '<span>Masuk Ke Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
        }
      } catch (err) {
        showAlert('Gagal terhubung ke server. Pastikan server Node.js berjalan.');
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>Masuk Ke Dashboard</span> <i class="fa-solid fa-arrow-right"></i>';
      }
    }
  </script>
</body>
</html>
