<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login & Register - Dashboard Preventive Maintenance RJBT</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1e36 0%, #0f2942 50%, #031322 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ornamen Latar Belakang Gradient */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 132, 189, 0.25) 0%, rgba(0, 0, 0, 0) 70%);
      top: -100px;
      right: -100px;
      border-radius: 50%;
      z-index: 0;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(250, 204, 21, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -100px;
      left: -100px;
      border-radius: 50%;
      z-index: 0;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 30, 52, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      z-index: 1;
      color: #ffffff;
      position: relative;
    }

    /* Header Logo PLN Icon Plus RJBT */
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .sidebar-brand-img {
      height: 46px;
      width: auto;
      object-fit: contain;
    }

    .brand-text-group {
      text-align: left;
      line-height: 1.1;
    }

    .brand-title {
      font-size: 1.45rem;
      font-weight: 800;
      color: #0084bd; /* Biru khas PLN Icon Plus */
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 0.88rem;
      color: #e2e8f0;
      font-weight: 700;
    }

    .brand-system-tag {
      font-size: 0.78rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 6px;
      letter-spacing: 0.3px;
    }

    /* Tab Switcher */
    .tab-switcher {
      display: flex;
      background: rgba(2, 12, 27, 0.6);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 22px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: #0084bd;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 132, 189, 0.35);
    }

    /* Form Styles */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .auth-form.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.95rem;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 0.9rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: #38bdf8;
    }

    .form-control {
      width: 100%;
      padding: 12px 40px 12px 40px;
      background: rgba(2, 12, 27, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.25s ease;
    }

    .form-control:focus {
      border-color: #0084bd;
      box-shadow: 0 0 0 3px rgba(0, 132, 189, 0.25);
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0084bd 0%, #005f8a 100%);
      border: none;
      border-radius: 10px;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 6px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #0098d9 0%, #0072a6 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 132, 189, 0.4);
    }

    /* Alert Message Box */
    .alert-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      display: none;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: rgba(225, 29, 72, 0.2);
      border: 1px solid rgba(225, 29, 72, 0.4);
      color: #fca5a5;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .footer-text {
      text-align: center;
      margin-top: 24px;
      font-size: 0.75rem;
      color: #64748b;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <!-- Header Logo PLN Icon Plus RJBT -->
    <div class="brand-header">
      <div class="brand-logo-badge">
        <img src="pln-logo.png" alt="PLN Icon Plus Logo" class="sidebar-brand-img">
        <div class="brand-text-group">
          <div class="brand-title">PLN</div>
          <div class="brand-subtitle">Icon Plus</div>
        </div>
      </div>
      <div class="brand-system-tag">Monitoring & Preventive Maintenance RJBT</div>
    </div>

    <!-- Alert Message -->
    <div id="alertBox" class="alert-box"></div>

    <!-- Tab Switcher -->
    <div class="tab-switcher">
      <button type="button" class="tab-btn active" onclick="switchAuthTab('login')">Masuk (Login)</button>
      <button type="button" class="tab-btn" onclick="switchAuthTab('register')">Daftar Akun</button>
    </div>

    <!-- Form Login -->
    <form id="formLogin" class="auth-form active" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="loginUsername">Username / Email</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user input-icon"></i>
          <input type="text" id="loginUsername" class="form-control" placeholder="Masukkan username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">Password</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('loginPassword', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Masuk Ke Dashboard</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <!-- Form Register -->
    <form id="formRegister" class="auth-form" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regNama">Nama Lengkap</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-id-card input-icon"></i>
          <input type="text" id="regNama" class="form-control" placeholder="Nama Petugas / Admin" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regUsername">Username</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-user-tag input-icon"></i>
          <input type="text" id="regUsername" class="form-control" placeholder="username_bebas" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regEmail">Email Perusahaan</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input type="email" id="regEmail" class="form-control" placeholder="admin@iconpln.co.id" required>
        </div>
      </div>

      <div class="form-group">
        <label for="regPassword">Password (Minimal 8 Karakter)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-key input-icon"></i>
          <input type="password" id="regPassword" class="form-control" placeholder="Minimal 8 karakter" minlength="8" required autocomplete="new-password">
          <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility('regPassword', this)"></i>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Buat Akun Baru</span>
        <i class="fa-solid fa-user-plus"></i>
      </button>
    </form>

    <div class="footer-text">
      &copy; 2026 PLN Icon Plus SBU Regional Jawa Bagian Timur.<br>
      Preventive Maintenance & Monitoring System.
    </div>
  </div>

  <script>
    // Ganti Tab Login / Register
    function switchAuthTab(type) {
      const btnTabs = document.querySelectorAll('.tab-btn');
      const forms = document.querySelectorAll('.auth-form');
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      btnTabs.forEach(btn => btn.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));

      if (type === 'login') {
        btnTabs[0].classList.add('active');
        document.getElementById('formLogin').classList.add('active');
      } else {
        btnTabs[1].classList.add('active');
        document.getElementById('formRegister').classList.add('active');
      }
    }

    // Toggle Lihat / Sembunyikan Password
    function togglePasswordVisibility(inputId, icon) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Tampilkan Pesan Notifikasi
    function showAlert(message, isSuccess = false) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `alert-box ${isSuccess ? 'alert-success' : 'alert-error'}`;
      alertBox.innerHTML = `<i class="fa-solid ${isSuccess ? 'fa-circle-check' : 'fa-circle-exclamation'}"></i> ${message}`;
      alertBox.style.display = 'flex';
    }

    // Process Login
    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Login berhasil! Mengalihkan ke Dashboard...', true);
          localStorage.setItem('user_session', JSON.stringify(data.user));
          
          setTimeout(() => {
            // Mengarahkan ke halaman index.html
            window.location.href = '/index.html'; 
          }, 1000);
        } else {
          showAlert(data.error || 'Login gagal! Periksa username/password Anda.');
        }
      } catch (err) {
        showAlert('Gagal terhubung ke server. Pastikan server Node.js berjalan.');
      }
    }

    // Process Register
    async function handleRegister(e) {
      e.preventDefault();
      const nama = document.getElementById('regNama').value.trim();
      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      // Pengecekan Panjang Password
      if (password.length < 8) {
        showAlert('Password minimal harus 8 karakter!');
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, username, email, password })
        });

        const data = await res.json();
        if (res.ok) {
          showAlert('Registrasi berhasil! Silakan login.', true);
          setTimeout(() => {
            switchAuthTab('login');
          }, 1200);
        } else {
          showAlert(data.error || 'Registrasi gagal!');
        }
      } catch (err) {
        showAlert('Gagal terhubung ke server.');
      }
    }
  </script>
</body>
</html>
